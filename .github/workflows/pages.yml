# Publishes the docs site to GitHub Pages on every push to main:
#   /                      Storybook (component docs and examples)
#   /registry/             component registry (sparkwire CLI, shadcn) and docs.json
#   /llms.txt, /llms-full.txt  docs for AI agents
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Docs site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          SPARKWIRE_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: npx storybook build --quiet --disable-telemetry -o site
      - name: Add registry and llms.txt
        run: |
          cp -r registry site/registry
          cp registry/llms.txt registry/llms-full.txt site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
