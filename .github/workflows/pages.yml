# Publishes the docs site to GitHub Pages on every push to master:
#   /                      Storybook (component docs and examples)
#   /registry/             component registry (sparkwire CLI, shadcn) and docs.json
#   /llms.txt, /llms-full.txt  docs for AI agents
#
# Before deploying, it screenshots every story and compares with
# tests/visual/__screenshots__. A story without a baseline gets one (committed
# back to master); a changed story fails the run and the site isn't deployed.
# To accept intended visual changes: Actions → Docs site → Run workflow →
# tick "update screenshots".
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Docs site

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Accept visual changes: update the screenshot baselines and commit them'
        type: boolean
        default: false

permissions:
  contents: write # commit new or updated screenshot baselines
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # the branch, so new baselines can be pushed back
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          SPARKWIRE_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Build Storybook
        run: npx storybook build --quiet --disable-telemetry

      - name: Install Chromium for the visual tests
        run: npx playwright install --with-deps chromium
      - name: Visual regression (every story)
        run: npx playwright test ${{ inputs.update_screenshots && '--update-snapshots' || '' }}
      - name: Commit new or updated screenshots
        if: always()
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "No new screenshots."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: update visual baselines'
          git push
      - name: Upload the visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: playwright-report
          retention-days: 14

      - name: Assemble the site
        run: |
          cp -r storybook-static site
          cp -r registry site/registry
          cp registry/llms.txt registry/llms-full.txt site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
