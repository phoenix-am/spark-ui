# Publishes the docs site to GitHub Pages on every push to master:
#   /                      the docs app (site/: landing page, guides, component pages)
#   /registry/             component registry (sparkwire CLI, shadcn) and docs.json
#   /llms.txt, /llms-full.txt  docs for AI agents
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Docs site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          SPARKWIRE_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Build the docs site
        run: npx vite build --config site/vite.config.ts
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
      - name: Add registry and llms.txt
        run: |
          cp -r registry site-dist/registry
          cp registry/llms.txt registry/llms-full.txt site-dist/
          # GitHub Pages has no rewrites: serve the app for any unknown path.
          cp site-dist/index.html site-dist/404.html
          touch site-dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
