name: Publish to npm

# How releases work (changesets):
#  1. Pull requests that change a package add a changeset (`npx changeset`).
#  2. On every push to master this workflow opens or updates a
#     "Version packages" pull request: versions bumped, CHANGELOG.md written.
#  3. Merging that pull request runs this workflow again, which publishes
#     the new versions to npm and creates the GitHub release vX.Y.Z.
# By hand (Actions → Run workflow) it does a dry run by default.
#
# Publishing uses npm Trusted Publishing (OIDC). NPM_TOKEN is only a
# fallback; delete it once each package's trusted publisher is set.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack, but do not publish)'
        type: boolean
        default: true

permissions:
  contents: write # push the version branch, create the GitHub release
  pull-requests: write # open the Version packages pull request
  id-token: write # trusted publishing and provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (behaviour and axe)
        run: npm test -- --ci
      - name: Build packages
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run release -- --dry-run

      - name: Version pull request, or publish
        id: changesets
        if: github.event_name == 'push' || !inputs.dry_run
        uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'Version packages'
          commit: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One release for the whole library (all packages share a version),
      # with the notes from @sparkwire/core's changelog.
      - name: GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag exists"; exit 0; fi
          awk -v v="## $version" '$0==v{on=1;next} /^## /{if(on)exit} on' packages/core/CHANGELOG.md > notes.md
          node -e "const fs=require('fs');const l=fs.readdirSync('packages').map(d=>require('./packages/'+d+'/package.json')).filter(p=>!p.private).map(p=>'\x60'+p.name+'@'+p.version+'\x60');console.log('\n---\n**Packages:** '+l.join(' · '))" >> notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
