name: CI

# Fast checks on every push and pull request. Storybook and the screenshot
# tests run in the Docs site workflow, which builds Storybook anyway.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Accessibility (axe on every story) and behaviour tests
        run: npm test -- --ci
      - name: Build packages
        run: npm run build
      - name: Registry is up to date
        run: git diff --exit-code -- registry || (echo 'Run npm run build and commit registry/' && exit 1)
