name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Accept visual changes: update the screenshot baselines and commit them'
        type: boolean
        default: false

permissions:
  contents: write # commit new or updated screenshot baselines to the branch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself (not GitHub's merge commit), so new baselines can be pushed back.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Accessibility (axe on every story) and behaviour tests
        run: npm test -- --ci
      - name: Build packages
        run: npm run build
      - name: Build Storybook
        run: npx storybook build --quiet --disable-telemetry
      - name: Registry is up to date
        run: git diff --exit-code -- registry || (echo 'Run npm run build and commit registry/' && exit 1)

      # Visual regression: a screenshot of every story, compared with tests/visual/__screenshots__.
      # A story without a baseline gets one (committed below); a changed story fails.
      - name: Install Chromium for the visual tests
        run: npx playwright install --with-deps chromium
      - name: Visual regression (every story)
        run: npx playwright test ${{ inputs.update_screenshots && '--update-snapshots' || '' }}
      - name: Commit new or updated screenshots
        if: always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || inputs.update_screenshots)
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "No new screenshots."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: update visual baselines'
          git push
      - name: Upload the visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: playwright-report
          retention-days: 14
